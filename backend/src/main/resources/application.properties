server.port=${PORT:8185}

# Database. Defaults target the local Postgres container in compose.yml.
# Deployed environments override these with real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medora}
spring.datasource.username=${DB_USERNAME:medora}
spring.datasource.password=${DB_PASSWORD:medora}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Left on deliberately. Patient.problems and Patient.admissions are LAZY and
# are mapped to DTOs in the service layer, outside any transaction, so turning
# this off raises LazyInitializationException on the patient endpoints. Setting
# it explicitly also silences the startup warning. Fixing it properly means
# fetch joins or @Transactional on the read paths.
spring.jpa.open-in-view=true

# Starts Postgres from compose.yml during local development.
# Set to false when pointing DB_URL at a managed database.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=./compose.yml

# Browser origins allowed to call the API, comma separated.
medora.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:3000}

# Passwords for the accounts seeded on first boot. Seeding is skipped
# entirely when these are blank, so an empty value is safe.
medora.seed.admin-password=${ADMIN_PASSWORD:}
medora.seed.doctor-password=${DOCTOR_PASSWORD:}
medora.seed.receptionist-password=${RECEPTIONIST_PASSWORD:}

# Never return stack traces or internal detail to clients. Unhandled errors
# leaked a full Java trace in the response body.
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false
