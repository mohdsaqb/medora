# Tests run against in-memory H2 so they need no Docker and no network.
spring.datasource.url=jdbc:h2:mem:medora;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.docker.compose.enabled=false

medora.cors.allowed-origins=http://localhost:3000

# Blank so the seeder stays inactive during tests.
medora.seed.admin-password=
medora.seed.doctor-password=
medora.seed.receptionist-password=
