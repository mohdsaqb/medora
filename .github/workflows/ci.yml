name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v6
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # Tests run against in-memory H2, configured in
      # backend/src/test/resources/application.properties, so no database
      # service is needed here.
      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend
        env:
          CI: true

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          CI: true
