version: 2
updates:
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The frontend is pinned to React 16 on Create React App. Major bumps of
    # React, the routers, the date picker and the testing library have to land
    # together as one migration, so individually they only break the build.
    # Patches and minors are still welcome.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
